<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>password generator</h1>
    <div class="underline"></div>
    <!-- INPUT BOX -->
     <div class="input-copy-container">
       <input class="input" type="text"> 
       <div class="copy-btn">
        <i class="fa-regular fa-copy"></i>
       </div>
     </div>
     <!-- rules -->
      <div class="password-rules">
        <!-- password length -->
         <div class="password-length-container">
          <h3>password length</h3>
          <input type="range" class="range" min="6" max="24" value="12" >
          <p> <span class="password-length-num">12</span> </p>
         </div>
         <!-- includes: -->
          <div class="includes">
            <div class="each-include">
              <label for="lowercase">includes lowercase</label>
              <input id="lowercase" type="checkbox">
            </div>
            <div class="each-include">
              <label for="uppercase">includes uppercase</label>
              <input id="uppercase" type="checkbox">
            </div>
            <div class="each-include">
              <label for="numbers">includes numbers</label>
              <input id="numbers" type="checkbox">
            </div>
            <div class="each-include">
              <label for="symbols">includes symbols</label>
              <input id="symbols" type="checkbox">
            </div>
          </div>
      </div>

      <!-- btn to generate password -->
        <button class="generate-btn">generate password</button>

       <!-- password strength check -->
        <div class="password-strength">
          <h3>password strength:</h3>
          <p class="password-level"></p>
        </div>

        <!-- bar -->
        <div class="strength-meter">
          <div class="strength-bar"></div>
        </div>
  </div>
  <!-- script -->
  <script src="script.js"></script>
</body>
</html>
